<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/styling.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
  </script>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body class="contact-page">

  <nav class="navbar navbar-expand-lg navbar-dark fixed-top custom-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">NeonTech</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse justify-content-center" id="navbarNav">
        <ul class="navbar-nav gap-lg-4">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="portfolio.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="naam.html">Portfolio</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <section class="contact-hero">
    <div class="contact-overlay"></div>

    <div class="container position-relative z-2">
      <div class="row align-items-center g-5">

        <!-- Left side -->
        <div class="col-lg-4 text-white">
          <h1 class="contact-title">Contact me</h1>

          <div class="contact-info-box">
            <p><strong>Phone:</strong> 03 220 33 00</p>
            <p><strong>Email:</strong> s172438@ap.be</p>
            <p><strong>Adress:</strong> Antwerpen, Belgium</p>
          </div>
        </div>

        <!-- Right side -->
        <div class="col-lg-8">
          <form class="contact-form" id="contactForm">
            <input type="text" class="contact-input" id="name" placeholder="Name" required>
            <input type="email" class="contact-input" id="email" placeholder="Email" required>
            <input type="text" class="contact-input" id="subject" placeholder="Subject">
            <textarea class="contact-input contact-textarea" id="message" placeholder="Message"></textarea>
            <button type="submit" class="btn btn-outline-light">Submit</button>
          </form>
        </div>
      </div>

      <div class="row mt-5">
        <div class="col-md-6">
          <h3 class="text-white">Submitted People</h3>
          <table class="table transparent-table mt-3">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
              </tr>
            </thead>
            <tbody id="tableBody">
            </tbody>
          </table>
        </div>

        <div class="col-md-6">
          <h3 class="text-white">Location</h3>
          <div id="map"></div>
        </div>
      </div>
    </div>

    <!-- Bottom left logo and social icons -->
    <div class="bottom-left">
      <img src="/images/Logo v3.jpg" alt="NeonTech Logo" class="corner-logo">
      <div class="social-icons">
        <a href="#"><i class="bi bi-instagram"></i></a>
        <a href="#"><i class="bi bi-facebook"></i></a>
        <a href="#"><i class="bi bi-linkedin"></i></a>
        <a href="#"><i class="bi bi-twitter-x"></i></a>
      </div>
    </div>
    <p class="image-credit">
      Background image source: ©https://www.magnific.com/free-photos-vectors/gaming-city-wallpaper
    </p>
  </section>

  <script>
  const map = L.map('map').setView([51.2194, 4.4025], 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  L.marker([51.2194, 4.4025])
  .addTo(map)
  .bindPopup("Antwerpen")
  .openPopup();
  </script>

  <script>
  const contactForm = document.getElementById('contactForm');
  const tableBody = document.getElementById('tableBody');

  contactForm.addEventListener('submit', function(event) {
    event.preventDefault();

    const name = document.getElementById('name').value;
    const email = document.getElementById('email').value;

    const newRow = document.createElement('tr');
    newRow.innerHTML = '<td>' + name + '</td><td>' + email + '</td>';
    tableBody.appendChild(newRow);

    contactForm.reset();
  });
  </script>
</body>
</html>
